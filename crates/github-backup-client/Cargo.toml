[package]
name        = "github-backup-client"
description = "Async GitHub REST API client for github-backup-rust (hyper + rustls, no OpenSSL)"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
authors.workspace       = true
license.workspace       = true
repository.workspace    = true
documentation.workspace = true
keywords.workspace      = true
categories.workspace    = true

# Internal workspace crate. Not published to crates.io.
publish                 = false

[features]
# Exposes `GitHubClient::for_tests_at` (plain HTTP, no proxy) to other crates'
# tests.  Never enabled in a normal build.
test-support = []

[dependencies]
github-backup-types = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
tokio-rustls = { workspace = true }
tower-service = { workspace = true }
base64 = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# RS256 signing of GitHub App JWTs.  Already in the build as rustls's crypto
# provider (same features), so it adds no crate; see `app_auth` for the choice.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# Wipes the App's private key and installation tokens from memory.
zeroize = { workspace = true }
# Reads the `expires_at` of an installation token.
jiff = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = { workspace = true }
# Captures `tracing` output in tests (warnings about elements that do not fit
# their model must name the endpoint, index and id).
tracing-subscriber = { workspace = true }
