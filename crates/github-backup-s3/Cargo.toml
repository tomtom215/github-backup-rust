[package]
name        = "github-backup-s3"
description = "S3-compatible storage backend with AES-256-GCM at-rest encryption for github-backup-rust (pure Rust, no AWS SDK)"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
authors.workspace       = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
keywords.workspace      = true
categories.workspace    = true

# Internal workspace crate. Not published to crates.io.
publish                 = false

[dependencies]
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
zeroize = { workspace = true }
# `aes-gcm`'s own `zeroize` feature only wipes the GHASH key.  The expanded AES
# round keys are wiped on drop only when the `aes` crate's `zeroize` feature is
# enabled, so it is requested explicitly (see `docs/src/storage/encryption.md`).
aes = { version = "0.8", features = ["zeroize"] }
# Constant-time comparison of the stored and the recomputed plaintext digest.
subtle = "2"

[dev-dependencies]
tokio = { workspace = true }
# The integration tests under `tests/` run a SigV4-verifying fake S3 server
# in-process, which needs hyper's server half.
hyper = { workspace = true, features = ["server"] }
tokio-test = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
