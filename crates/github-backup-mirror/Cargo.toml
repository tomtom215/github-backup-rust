[package]
name        = "github-backup-mirror"
description = "Push-mirror backup to Gitea / Codeberg / Forgejo / GitLab for github-backup-rust"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
authors.workspace       = true
license.workspace       = true
repository.workspace    = true
documentation.workspace = true
keywords.workspace      = true
categories.workspace    = true

# Internal workspace crate. Not published to crates.io.
publish                 = false

[dependencies]
# The shared proxy-aware HTTP client (`github_backup_client::ProxyClient`).
github-backup-client = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The API client tests run a fake Gitea / GitLab server in-process.
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server"] }
tokio-test = { workspace = true }
tempfile = { workspace = true }
# Test clients trust an empty certificate store.
rustls = { workspace = true }
