[package]
name        = "github-backup"
description = "GitHub backup tool: repositories, issues, PRs, releases, gists, wikis, and metadata"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
authors.workspace       = true
license.workspace       = true
repository.workspace    = true
documentation.workspace = true
keywords.workspace      = true
categories.workspace    = true

# Not published to crates.io. This project ships as pre-built binaries
# on GitHub Releases, multi-arch container images on GHCR, and source
# install via `cargo install --git`. See docs/src/getting-started/installation.md.
publish                 = false

[[bin]]
name = "github-backup"
path = "src/main.rs"

[dependencies]
github-backup-types = { workspace = true }
github-backup-client = { workspace = true }
github-backup-core = { workspace = true }
github-backup-mirror = { workspace = true }
github-backup-s3 = { workspace = true }
github-backup-tui = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
github-backup-client = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
rustls = { workspace = true }

# `cargo binstall --git https://github.com/tomtom215/github-backup-rust github-backup`
# downloads the release binary instead of compiling.  The URLs are the asset
# names that .github/workflows/release.yml publishes; other targets fall back
# to a source build.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/github-backup-linux-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/github-backup-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/github-backup-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/github-backup-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/github-backup-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/github-backup-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/github-backup-windows-x86_64.exe"
