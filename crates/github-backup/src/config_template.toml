# github-backup configuration template
#
# Generated by `github-backup --print-config-template`.
#
# Save this file as `~/.config/github-backup/config.toml` (loaded
# automatically) or anywhere else and pass `--config /path/to/config.toml`.
# `chmod 600` it if it will hold a token.
#
# Every key is optional.  A command-line value wins over the same option here;
# a category set to `true` in this file is switched off from the command line
# with `--skip <name>`, other switches only by editing the file.

# ── Identity ──────────────────────────────────────────────────────────────

# The GitHub user or organisation to back up (default: the account the token
# belongs to).
# owner = "octocat"

# Treat `owner` as an organisation.  Not needed: an organisation is detected.
# org = false

# ── Authentication ────────────────────────────────────────────────────────

# Personal access token.  **Prefer** the `GITHUB_TOKEN` / `GH_TOKEN`
# environment variables or `gh auth login`; tokens in config files are visible
# to anyone who can read the file.
# token = "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# GitHub Enterprise Server API URL (default: https://api.github.com).
# api_url = "https://github.example.com/api/v3"

# Override the git clone hostname (for split API / clone GHES deployments).
# clone_host = "github-git.example.com"

# ── Output ────────────────────────────────────────────────────────────────

# Root directory for all backup artefacts (default: the current directory).
# output = "/var/backup/github"

# Maximum number of repositories to back up concurrently (default: 4).
# concurrency = 4

# Write a JSON summary report after the backup completes.
# report = "/var/log/github-backup/report.json"

# ── Backup categories ─────────────────────────────────────────────────────
# With none of these set, everything is backed up (as with `all = true`).
# Setting any category backs up only the categories set.

# all = true               # everything (see README for what's included)

# Leave categories out of the default / `all` (names as for `--skip`).
# skip = ["hooks", "packages"]

# repositories = true
# forks = true
# private = true
# issues = true
# issue_comments = true
# issue_events = true
# pulls = true
# pull_comments = true
# pull_commits = true
# pull_reviews = true
# labels = true
# milestones = true
# releases = true
# release_assets = false   # binary assets — can be very large
# wikis = true
# topics = true
# branches = true
# deploy_keys = true       # requires admin scope
# collaborators = true     # requires admin scope
# hooks = true             # requires admin scope
# security_advisories = true
# starred = true
# starred_gists = true
# clone_starred = false    # clone every starred repo (opt-in: very large)
# watched = true
# followers = true
# following = true
# gists = true
# org_members = true       # requires --org
# org_teams = true         # requires --org
# actions = true
# action_runs = false      # full run history — can be very large
# environments = true
# discussions = false      # not backed up yet: GitHub serves discussions through GraphQL only
# projects = true          # Projects (v2): fields and items; needs read:project
# packages = true
# commit_comments = true

# ── Repository filtering (glob patterns, case-insensitive) ────────────────

# include_repos = ["rust-*", "deploy-*"]
# exclude_repos = ["*-archive", "*-fork"]

# ── Incremental backup ────────────────────────────────────────────────────

# Treat everything updated before this date as already backed up and skip
# re-fetching the comments, events, commits and reviews of such issues and pull
# requests (the lists themselves are always fetched in full).  Leave unset to
# let each repository use its own watermark from the previous run.
# since = "2025-01-01T00:00:00Z"

# ── Clone behaviour ───────────────────────────────────────────────────────

# clone_type = "mirror"    # one of: mirror, bare, full, "shallow:<depth>"
# prefer_ssh = false       # use SSH URLs (requires ssh-agent)
# lfs = false              # clone Git LFS objects too
# prune = false            # true: delete branches and tags that were deleted on GitHub (default: keep them)
# verify_git = false       # true: check every repository with `git fsck` after each update (slow on big repos)
# git_timeout = 600        # seconds a git command may stay silent before it is stopped as stalled

# ── Mirror push (Gitea / Codeberg / Forgejo / GitLab) ─────────────────────

# mirror_to = "https://codeberg.org"
# mirror_type = "gitea"    # gitea (Gitea, Codeberg, Forgejo) or gitlab
# mirror_token = "..."     # PREFER MIRROR_TOKEN env var
# mirror_owner = "your-username"
# Mirrors are created private.  Set mirror_public = true to create mirrors of
# repositories that are public on GitHub as public (private ones stay private).
# mirror_public = false
# mirror_private = false   # explicit form of the default

# ── S3-compatible storage ─────────────────────────────────────────────────

# s3_bucket = "my-github-backups"
# s3_region = "us-east-1"
# s3_prefix = "github-backup/"
# s3_endpoint = "https://s3.us-west-004.backblazeb2.com"   # B2/MinIO/R2 etc.
# s3_access_key = "..."    # PREFER AWS_ACCESS_KEY_ID env var
# s3_secret_key = "..."    # PREFER AWS_SECRET_ACCESS_KEY env var
# s3_include_assets = false
