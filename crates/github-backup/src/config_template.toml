# github-backup configuration template
#
# Generated by `github-backup --print-config-template`.
#
# Save this file (typically `/etc/github-backup/config.toml` or
# `~/.config/github-backup/config.toml`), `chmod 600` it if it will hold a
# token, then run:
#
#     github-backup --config /path/to/config.toml
#
# All keys are optional unless marked REQUIRED.  Command-line flags
# override values in this file.

# ── Identity ──────────────────────────────────────────────────────────────

# REQUIRED — the GitHub user or organisation to back up.
# owner = "octocat"

# Treat `owner` as an organisation (uses the org repos API).
# org = false

# ── Authentication ────────────────────────────────────────────────────────

# Personal access token.  **Prefer** the `GITHUB_TOKEN` environment variable;
# tokens in config files are visible to anyone who can read the file.
# token = "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# GitHub Enterprise Server API URL (default: https://api.github.com).
# api_url = "https://github.example.com/api/v3"

# Override the git clone hostname (for split API / clone GHES deployments).
# clone_host = "github-git.example.com"

# ── Output ────────────────────────────────────────────────────────────────

# REQUIRED — root directory for all backup artefacts.
# output = "/var/backup/github"

# Maximum number of repositories to back up concurrently (default: 4).
# concurrency = 4

# Write a JSON summary report after the backup completes.
# report = "/var/log/github-backup/report.json"

# ── Backup categories ─────────────────────────────────────────────────────
# Enable a single bulk flag, or pick individual categories.

# all = true               # everything (see README for what's included)

# repositories = true
# forks = true
# private = true
# issues = true
# issue_comments = true
# issue_events = true
# pulls = true
# pull_comments = true
# pull_commits = true
# pull_reviews = true
# labels = true
# milestones = true
# releases = true
# release_assets = false   # binary assets — can be very large
# wikis = true
# topics = true
# branches = true
# deploy_keys = true       # requires admin scope
# collaborators = true     # requires admin scope
# hooks = true             # requires admin scope
# security_advisories = true
# starred = true
# starred_gists = true
# clone_starred = false    # clone every starred repo (opt-in: very large)
# watched = true
# followers = true
# following = true
# gists = true
# org_members = true       # requires --org
# org_teams = true         # requires --org
# actions = true
# action_runs = false      # full run history — can be very large
# environments = true
# discussions = true
# projects = true
# packages = true

# ── Repository filtering (glob patterns, case-insensitive) ────────────────

# include_repos = ["rust-*", "deploy-*"]
# exclude_repos = ["*-archive", "*-fork"]

# ── Incremental backup ────────────────────────────────────────────────────

# Only fetch issues / PRs updated at or after this ISO 8601 timestamp.
# Leave unset to inherit the previous run's timestamp automatically.
# since = "2025-01-01T00:00:00Z"

# ── Clone behaviour ───────────────────────────────────────────────────────

# clone_type = "mirror"    # one of: mirror, bare, full, "shallow:<depth>"
# prefer_ssh = false       # use SSH URLs (requires ssh-agent)
# lfs = false              # clone Git LFS objects too
# no_prune = false         # keep refs deleted upstream

# ── Mirror push (Gitea / Codeberg / Forgejo / GitLab) ─────────────────────

# mirror_to = "https://codeberg.org"
# mirror_token = "..."     # PREFER MIRROR_TOKEN env var
# mirror_owner = "your-username"
# mirror_private = false

# ── S3-compatible storage ─────────────────────────────────────────────────

# s3_bucket = "my-github-backups"
# s3_region = "us-east-1"
# s3_prefix = "github-backup/"
# s3_endpoint = "https://s3.us-west-004.backblazeb2.com"   # B2/MinIO/R2 etc.
# s3_access_key = "..."    # PREFER AWS_ACCESS_KEY_ID env var
# s3_secret_key = "..."    # PREFER AWS_SECRET_ACCESS_KEY env var
# s3_include_assets = false
