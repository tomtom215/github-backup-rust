#
# Scheduled dependency advisory audit.  CI audits only when code changes; new
# RustSec advisories appear independently of commits, so this runs daily
# against the committed Cargo.lock and can also be started by hand.
name: Advisory audit

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Tag ref, not a commit SHA (see ci.yml); Dependabot keeps it current.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources bans licenses
