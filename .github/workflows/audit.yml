#
# Scheduled dependency advisory audit.  CI checks advisories (with cargo-deny)
# only when code changes; new RustSec advisories appear independently of
# commits, so this runs daily against the Cargo.lock on main and can also be
# started by hand.  A failure shows up as a failed scheduled run on main.
name: Advisory audit

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
