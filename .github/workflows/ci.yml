name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Mutation testing is opt-in: trigger from the Actions tab via the
  # "Run workflow" button when you want to validate the test suite's
  # ability to kill mutants. It is intentionally NOT run on every push
  # or PR because the full workspace mutation pass takes 20-30 minutes
  # and the diff-based PR variant produces noisy results when the
  # changed code lives in a file that is excluded by `.cargo/mutants.toml`.
  workflow_dispatch:
    inputs:
      mutants_scope:
        description: "Mutation testing scope"
        type: choice
        default: full
        options:
          - full
          - diff
        required: true

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# A new push to a pull request cancels the run for the superseded commit.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Toolchain: every job except MSRV uses the compiler pinned in
# rust-toolchain.toml (rustup reads it; `rustup toolchain install` with no
# argument installs it), so a new stable release never turns CI red without a
# reviewed change to that file.
#
# Third-party actions are pinned to full commit SHAs (the comment names the
# release); Dependabot keeps them current.

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # ── MSRV ────────────────────────────────────────────────────────────────────
  # The version comes from `rust-version` in Cargo.toml (the single source);
  # `cargo +<version>` overrides rust-toolchain.toml.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the MSRV toolchain
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no rust-version found"
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on the MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --workspace --all-targets --locked

  # ── Docs (rustdoc) ──────────────────────────────────────────────────────────
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── mdBook (build + link check) ─────────────────────────────────────────────
  # Prebuilt, checksum-verified binaries.  mdbook-linkcheck 0.7.7 needs
  # mdBook 0.4.x, so mdBook stays on the 0.4 series.  Keep the versions in
  # sync with pages.yml.
  book:
    name: mdBook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: mdbook@0.4.52,mdbook-linkcheck@0.7.7
      - run: mdbook build docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book
          path: docs/book/
          retention-days: 7

  # ── cargo-deny (licences, bans, advisories, sources) ────────────────────────
  # Advisories against main are also checked daily by audit.yml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check licenses bans advisories sources

  # ── Workflow security lint ──────────────────────────────────────────────────
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          version: 1.33.1
          # Report findings as a failing check, without uploading SARIF (which
          # would need `security-events: write`).
          advanced-security: false

  # ── Docker image build + smoke test ─────────────────────────────────────────
  #
  # Builds the exact Dockerfile that release.yml and edge.yml publish (so a
  # broken Dockerfile fails here, not at tag time) and runs the image's
  # entrypoint contract: `--version`, `--help`, and the empty-variable handling
  # that Compose / Unraid rely on.  No credentials are used: a dummy token only.
  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile RUST_VERSION matches rust-toolchain.toml
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          dockerfile=$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile)
          if [ -z "$toolchain" ] || [ "$toolchain" != "$dockerfile" ]; then
            echo "::error file=Dockerfile::ARG RUST_VERSION=$dockerfile but rust-toolchain.toml has channel $toolchain"
            exit 1
          fi
      - name: Build image
        run: docker build --tag github-backup:ci .
      - name: --version and --help
        run: |
          docker run --rm github-backup:ci --version
          docker run --rm github-backup:ci --help > /dev/null
      - name: Runs as numeric non-root user
        run: |
          test "$(docker inspect --format '{{.Config.User}}' github-backup:ci)" = "1000:1000"
          docker run --rm --entrypoint id github-backup:ci -u | grep -qx 1000
      - name: Empty optional variables are ignored (Compose / Unraid)
        run: |
          docker run --rm \
            -e GITHUB_TOKEN=ghp_dummy_not_a_real_token \
            -e BACKUP_ENCRYPT_KEY= -e GITHUB_API_URL= \
            -e BACKUP_MODE=--print-config-template \
            github-backup:ci > /dev/null
      - name: BACKUP_MODE without a leading -- is refused with status 64
        run: |
          status=0
          docker run --rm -e BACKUP_MODE=all github-backup:ci || status=$?
          test "$status" -eq 64
      - name: git, git-lfs and ssh are present
        run: |
          docker run --rm --entrypoint git github-backup:ci --version
          docker run --rm --entrypoint git github-backup:ci lfs version
          docker run --rm --entrypoint ssh github-backup:ci -V
      - name: Existing repo owned by another uid does not trip safe.directory
        run: |
          mkdir out && sudo chown 4242:4242 out
          docker run --rm --user 4242:4242 -v "$PWD/out:/backup" --entrypoint sh github-backup:ci -c \
            'git init -q /backup/r.git && git -C /backup/r.git status >/dev/null'
          docker run --rm --user 99:100 -v "$PWD/out:/backup" --entrypoint sh github-backup:ci -c \
            'git -C /backup/r.git status >/dev/null && echo ok-other-uid'
      # The release and edge images package an already-built binary
      # (BINARY_STAGE=prebuilt); check that path with the binary built above.
      - name: Image from a prebuilt binary
        run: |
          docker build --target export --output type=local,dest=bins/amd64 .
          docker build --build-arg BINARY_STAGE=prebuilt \
            --build-context binaries=bins --tag github-backup:prebuilt .
          docker run --rm github-backup:prebuilt --version
          cmp bins/amd64/github-backup \
            <(docker run --rm --entrypoint cat github-backup:prebuilt /usr/local/bin/github-backup)

  # ── Mutation testing (on-demand) ─────────────────────────────────────────────
  #
  # This job is gated on `workflow_dispatch` so it does NOT run automatically
  # on push or pull-request events.  Trigger it manually from the GitHub
  # Actions tab via "Run workflow" → choose `full` or `diff` scope.
  #
  #   - `full` (default): mutate every non-excluded file in the workspace.
  #     Takes 20-30 minutes and is the canonical pre-release check.
  #   - `diff`: mutate only the lines changed since `origin/main`.  Useful
  #     when iterating on a feature branch and you want a fast check that
  #     your new code is exercised by tests.
  #
  # The exclusion list and rationale live in `.cargo/mutants.toml`.
  mutants:
    # A static name: a skipped job would otherwise show the unevaluated
    # expression in the pull-request checks list.
    name: Mutation testing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need full history for --in-diff
          persist-credentials: false

      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Run mutation tests (diff scope)
        if: inputs.mutants_scope == 'diff'
        run: |
          git fetch origin main
          git diff origin/main...HEAD > pr.diff
          cargo mutants --workspace --timeout 120 --in-diff pr.diff -- --lib \
            2>&1 | tee mutants-report.txt

      - name: Run mutation tests (full scope)
        if: inputs.mutants_scope == 'full'
        run: |
          cargo mutants --workspace --timeout 120 -- --lib \
            2>&1 | tee mutants-report.txt

      - name: Upload mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-report
          path: mutants-report.txt
          retention-days: 14
