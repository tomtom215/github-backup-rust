name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Mutation testing is opt-in: trigger from the Actions tab via the
  # "Run workflow" button when you want to validate the test suite's
  # ability to kill mutants. It is intentionally NOT run on every push
  # or PR because the full workspace mutation pass takes 20-30 minutes
  # and the diff-based PR variant produces noisy results when the
  # changed code lives in a file that is excluded by `.cargo/mutants.toml`.
  workflow_dispatch:
    inputs:
      mutants_scope:
        description: "Mutation testing scope"
        type: choice
        default: full
        options:
          - full
          - diff
        required: true

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned toolchain: a new stable release (new clippy lints, new rustdoc
  # warnings) must never turn CI red without a code change.  Bump it in a
  # reviewed PR.  The MSRV job below checks the workspace `rust-version`.
  RUST_TOOLCHAIN: "1.97.0"
  # NOTE: third-party actions below are referenced by tag.  Pinning them to full
  # commit SHAs needs the SHAs resolved from GitHub and checked; .github/dependabot.yml
  # keeps these refs current in the meantime.

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # ── MSRV ────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  # ── Docs (rustdoc) ──────────────────────────────────────────────────────────
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── mdBook (build + link check) ─────────────────────────────────────────────
  book:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook and link checker
        run: |
          cargo install mdbook --version "0.4.40" --locked
          cargo install mdbook-linkcheck --version "0.7.7" --locked
      - run: mdbook build docs
      - uses: actions/upload-artifact@v7
        with:
          name: book
          path: docs/book/
          retention-days: 7

  # ── Security audit ──────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # rustsec/audit-check creates a check run and (optionally) an issue when an
    # advisory is found, so it needs explicit write permission for both. Without
    # these, the action errors out with
    #   "Resource not accessible by integration"
    # on the GitHub `checks` REST endpoint.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0097: `rand` is unsound when a custom logger calls
          # `rand::rng()` from inside its `log` callback. Our runtime tree
          # uses `rand >= 0.9.3` (patched). The remaining `rand 0.8.5` lock
          # entry is pulled in transitively by `phf_generator`, which is a
          # *build-time* proc macro used by `terminfo`/`termwiz` and is not
          # compiled into our binary (we explicitly disable the termwiz
          # backend in `crates/github-backup-tui/Cargo.toml`). The advisory
          # therefore does not apply to any code we ship.
          ignore: RUSTSEC-2026-0097

  # ── cargo-deny ──────────────────────────────────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories sources

  # ── Docker image build + smoke test ─────────────────────────────────────────
  #
  # Builds the exact Dockerfile that release.yml publishes (so a broken
  # Dockerfile fails here, not at tag time) and runs the image's entrypoint
  # contract: `--version`, `--help`, and the empty-variable handling that
  # Compose / Unraid rely on.  No credentials are used: a dummy token only.
  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag github-backup:ci .
      - name: --version and --help
        run: |
          docker run --rm github-backup:ci --version
          docker run --rm github-backup:ci --help > /dev/null
      - name: Runs as numeric non-root user
        run: |
          test "$(docker inspect --format '{{.Config.User}}' github-backup:ci)" = "1000:1000"
          docker run --rm --entrypoint id github-backup:ci -u | grep -qx 1000
      - name: Empty optional variables are ignored (Compose / Unraid)
        run: |
          docker run --rm \
            -e GITHUB_TOKEN=ghp_dummy_not_a_real_token \
            -e BACKUP_ENCRYPT_KEY= -e GITHUB_API_URL= \
            -e BACKUP_MODE=--print-config-template \
            github-backup:ci > /dev/null
      - name: git, git-lfs and ssh are present
        run: |
          docker run --rm --entrypoint git github-backup:ci --version
          docker run --rm --entrypoint git github-backup:ci lfs version
          docker run --rm --entrypoint ssh github-backup:ci -V
      - name: Existing repo owned by another uid does not trip safe.directory
        run: |
          mkdir out && sudo chown 4242:4242 out
          docker run --rm --user 4242:4242 -v "$PWD/out:/backup" --entrypoint sh github-backup:ci -c \
            'git init -q /backup/r.git && git -C /backup/r.git status >/dev/null'
          docker run --rm --user 99:100 -v "$PWD/out:/backup" --entrypoint sh github-backup:ci -c \
            'git -C /backup/r.git status >/dev/null && echo ok-other-uid'

  # ── Mutation testing (on-demand) ─────────────────────────────────────────────
  #
  # This job is gated on `workflow_dispatch` so it does NOT run automatically
  # on push or pull-request events.  Trigger it manually from the GitHub
  # Actions tab via "Run workflow" → choose `full` or `diff` scope.
  #
  #   - `full` (default): mutate every non-excluded file in the workspace.
  #     Takes 20-30 minutes and is the canonical pre-release check.
  #   - `diff`: mutate only the lines changed since `origin/main`.  Useful
  #     when iterating on a feature branch and you want a fast check that
  #     your new code is exercised by tests.
  #
  # The exclusion list and rationale live in `.cargo/mutants.toml`.
  mutants:
    name: Mutation testing (${{ github.event.inputs.mutants_scope }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history for --in-diff

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation tests (diff scope)
        if: github.event.inputs.mutants_scope == 'diff'
        run: |
          git fetch origin main
          git diff origin/main...HEAD > pr.diff
          cargo mutants --workspace --timeout 120 --in-diff pr.diff -- --lib \
            2>&1 | tee mutants-report.txt

      - name: Run mutation tests (full scope)
        if: github.event.inputs.mutants_scope == 'full'
        run: |
          cargo mutants --workspace --timeout 120 -- --lib \
            2>&1 | tee mutants-report.txt

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-report
          path: mutants-report.txt
          retention-days: 14
