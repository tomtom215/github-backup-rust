#
# Docker Compose configurations for github-backup-rust.
#
# By default, every service pulls the published multi-arch image from
# GHCR (`ghcr.io/tomtom215/github-backup-rust:latest`).  To build from a
# local checkout instead, run:
#
#     docker compose build
#     docker compose run --rm backup octocat --all
#
# Environment variables are loaded from `.env` in the same directory as
# this file.  Copy `compose.example.env` to `.env` and fill in your
# secrets before running any of the services below.
#
# ── Profiles ───────────────────────────────────────────────────────────────
#   (default)  – local filesystem backup, output → ./backups/
#   doctor     – run the --doctor pre-flight checks only
#   tui        – interactive full-screen TUI (needs a real terminal)
#   verify     – verify the integrity of an existing backup
#   s3         – backup + sync to AWS S3
#   b2         – backup + sync to Backblaze B2
#   minio      – backup + sync to a MinIO / S3-compatible server you run
#   codeberg   – backup + mirror push to Codeberg / Forgejo / Gitea
#   gitlab     – backup + mirror push to GitLab.com or self-hosted GitLab
#
# ── Usage ──────────────────────────────────────────────────────────────────
#   # First-time pre-flight check (git, output directory, network, token;
#   # one free /rate_limit request, no backup is made)
#   docker compose --profile doctor run --rm doctor octocat
#
#   # Local backup to ./backups/
#   docker compose run --rm backup octocat --all
#
#   # Interactive TUI (requires a TTY)
#   docker compose --profile tui run --rm tui octocat
#
#   # S3 sync after backup
#   docker compose --profile s3 run --rm backup-s3 octocat --all
#
#   # Mirror to Codeberg
#   docker compose --profile codeberg run --rm backup-codeberg octocat --all

# Shared anchors.
#
# `x-backup` is the common service definition; `x-env` is the common
# environment.  Every service (including each profile service) merges BOTH,
# and profile services add keys with `<<: *env` instead of replacing the map.
# (YAML merge keys are shallow: a bare `environment:` map on a service would
# silently drop the encryption key, webhook and GHES variables.)
#
# Environment values below are deliberately `null` (no `:-` / `-` default):
# Compose then forwards the variable only when it is set in `.env` or the
# shell, and omits it otherwise.  Writing `${VAR-}` instead would inject
# `VAR=""` into the container.  The image entrypoint additionally treats a
# set-but-empty value (`VAR=` in `.env`) as unset.
#
# Secrets are NOT `${VAR:?}`-guarded: Compose interpolates every service,
# even those in inactive profiles, so one missing optional variable would
# break unrelated commands.  The binary itself reports a missing token, and
# leaving GITHUB_TOKEN unset lets you use `--device-auth`.
#
# Fixed per-profile flags live in `entrypoint:` (after tini and the wrapper),
# so `docker compose run --rm SERVICE OWNER --all` *appends* your arguments
# instead of replacing `command:` and silently dropping `--s3-bucket` etc.
x-image: &image ghcr.io/tomtom215/github-backup-rust:${GITHUB_BACKUP_TAG:-latest}

x-backup: &backup
  image: *image
  # build: .                         # uncomment to build from local checkout
  # No `init: true`: the image already starts tini as PID 1.
  restart: "no"                      # run-to-completion tool
  # Numeric uid:gid that owns the backup directory.
  # Unraid: BACKUP_UID=99 BACKUP_GID=100 (and UMASK=000 if SMB users need write).
  user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
  volumes:
    - ${BACKUP_DIR:-./backups}:/backup   # where backup output is written

x-env: &env
  GITHUB_TOKEN:
  GITHUB_API_URL:
  GITHUB_CLONE_HOST:
  GITHUB_OAUTH_CLIENT_ID:
  BACKUP_NOTIFY_WEBHOOK:
  BACKUP_ENCRYPT_KEY:
  GITHUB_BACKUP_RESTORE_YES:
  UMASK:
  # HTTPS_PROXY / NO_PROXY are intentionally not forwarded: a host-side
  # loopback proxy would be unreachable from the container.  Add
  # `HTTPS_PROXY:` here if the container needs one.

services:
  # ── Local filesystem backup (default profile) ──────────────────────────────
  # The image WORKDIR is /backup and the default output directory is ".", so
  # no `--output` flag is needed.  No config.toml is mounted by default so a
  # fresh checkout works immediately.  Mount one explicitly with:
  #   docker compose run --rm \
  #     -v $(pwd)/config.toml:/etc/github-backup/config.toml:ro \
  #     backup octocat --config /etc/github-backup/config.toml
  backup:
    <<: *backup
    environment:
      <<: *env

  # ── --doctor pre-flight check ──────────────────────────────────────────────
  # Confirms git, network, token, and TLS before scheduling a real run.
  doctor:
    <<: *backup
    profiles: [doctor]
    entrypoint: [/sbin/tini, --, /usr/local/bin/docker-entrypoint.sh, --doctor]
    environment:
      <<: *env

  # ── Interactive TUI ────────────────────────────────────────────────────────
  # Allocates a TTY so ratatui can render.  Use `docker compose run --rm tui`,
  # not `up`, so the foreground TTY attaches correctly.
  tui:
    <<: *backup
    profiles: [tui]
    tty: true
    stdin_open: true
    entrypoint: [/sbin/tini, --, /usr/local/bin/docker-entrypoint.sh, --tui]
    environment:
      <<: *env

  # ── Verify an existing backup ──────────────────────────────────────────────
  verify:
    <<: *backup
    profiles: [verify]
    entrypoint: [/sbin/tini, --, /usr/local/bin/docker-entrypoint.sh, --verify]
    environment:
      <<: *env

  # ── AWS S3 metadata sync ───────────────────────────────────────────────────
  backup-s3:
    <<: *backup
    profiles: [s3]
    entrypoint:
      - /sbin/tini
      - --
      - /usr/local/bin/docker-entrypoint.sh
      - --s3-bucket
      - "${S3_BUCKET:-my-github-backup-bucket}"
      - --s3-region
      - "${S3_REGION:-us-east-1}"
    environment:
      <<: *env
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:

  # ── Backblaze B2 (S3-compatible) ───────────────────────────────────────────
  backup-b2:
    <<: *backup
    profiles: [b2]
    entrypoint:
      - /sbin/tini
      - --
      - /usr/local/bin/docker-entrypoint.sh
      - --s3-bucket
      - "${B2_BUCKET:-my-b2-bucket}"
      - --s3-region
      - "${B2_REGION:-us-west-004}"
      - --s3-endpoint
      - "https://s3.${B2_REGION:-us-west-004}.backblazeb2.com"
    environment:
      <<: *env
      AWS_ACCESS_KEY_ID: ${B2_KEY_ID-}
      AWS_SECRET_ACCESS_KEY: ${B2_APP_KEY-}

  # ── MinIO / other self-hosted S3-compatible endpoint ───────────────────────
  # This file no longer bundles a MinIO server: the `minio/minio` image is no
  # longer published on Docker Hub.  Point MINIO_ENDPOINT at any S3-compatible
  # server you run (MinIO, Garage, SeaweedFS, ...) and create MINIO_BUCKET
  # there first - the tool does not create buckets.
  backup-minio:
    <<: *backup
    profiles: [minio]
    entrypoint:
      - /sbin/tini
      - --
      - /usr/local/bin/docker-entrypoint.sh
      - --s3-bucket
      - "${MINIO_BUCKET:-github-backup}"
      - --s3-region
      - "${MINIO_REGION:-us-east-1}"
      - --s3-endpoint
      - "${MINIO_ENDPOINT:-http://minio.internal:9000}"
    environment:
      <<: *env
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD-}

  # ── Codeberg / Forgejo / Gitea mirror ──────────────────────────────────────
  backup-codeberg:
    <<: *backup
    profiles: [codeberg]
    entrypoint:
      - /sbin/tini
      - --
      - /usr/local/bin/docker-entrypoint.sh
      - --mirror-to
      - "${MIRROR_URL:-https://codeberg.org}"
      - --mirror-owner
      - "${MIRROR_OWNER:-}"
    environment:
      <<: *env
      MIRROR_TOKEN:

  # ── GitLab mirror ──────────────────────────────────────────────────────────
  backup-gitlab:
    <<: *backup
    profiles: [gitlab]
    entrypoint:
      - /sbin/tini
      - --
      - /usr/local/bin/docker-entrypoint.sh
      - --mirror-to
      - "${GITLAB_URL:-https://gitlab.com}"
      - --mirror-type
      - gitlab
      - --mirror-owner
      - "${GITLAB_NAMESPACE:-}"
    environment:
      <<: *env
      MIRROR_TOKEN: ${GITLAB_TOKEN-}
