#
# Docker Compose configurations for github-backup-rust.
#
# By default, every service pulls the published multi-arch image from
# GHCR (`ghcr.io/tomtom215/github-backup-rust:latest`).  To build from a
# local checkout instead, run:
#
#     docker compose build
#     docker compose run --rm backup octocat --all
#
# Environment variables are loaded from `.env` in the same directory as
# this file.  Copy `compose.example.env` to `.env` and fill in your
# secrets before running any of the services below.
#
# ── Profiles ───────────────────────────────────────────────────────────────
#   (default)  – local filesystem backup, output → ./backups/
#   doctor     – run --doctor pre-flight checks
#   tui        – interactive full-screen TUI (needs a real terminal)
#   verify     – verify the integrity of an existing backup
#   s3         – backup + sync to AWS S3
#   b2         – backup + sync to Backblaze B2
#   minio      – backup + sync to self-hosted MinIO (bundled side service)
#   codeberg   – backup + mirror push to Codeberg / Forgejo / Gitea
#   gitlab     – backup + mirror push to GitLab.com or self-hosted GitLab
#
# ── Usage ──────────────────────────────────────────────────────────────────
#   # First-time pre-flight check (no files written, no API calls billed)
#   docker compose --profile doctor run --rm doctor octocat
#
#   # Local backup to ./backups/
#   docker compose run --rm backup octocat --all
#
#   # Interactive TUI (requires a TTY)
#   docker compose --profile tui run --rm tui octocat
#
#   # S3 sync after backup
#   docker compose --profile s3 run --rm backup-s3 octocat --all
#
#   # Mirror to Codeberg
#   docker compose --profile codeberg run --rm backup-codeberg octocat --all

# Shared anchor: every service uses the same base image, volume layout,
# and minimum security-relevant settings.
x-image: &image ghcr.io/tomtom215/github-backup-rust:latest

x-common: &common
  image: *image
  # build: .                         # uncomment to build from local checkout
  # `init: true` lets docker inject tini if for some reason the image's
  # baked-in tini is not used (e.g. older Docker versions).  Harmless.
  init: true
  volumes:
    - ./backups:/backup              # where backup output is written
  environment:
    GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required — see compose.example.env}
    GITHUB_API_URL: ${GITHUB_API_URL-}
    GITHUB_CLONE_HOST: ${GITHUB_CLONE_HOST-}
    GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID-}
    BACKUP_NOTIFY_WEBHOOK: ${BACKUP_NOTIFY_WEBHOOK-}
    BACKUP_ENCRYPT_KEY: ${BACKUP_ENCRYPT_KEY-}
    GITHUB_BACKUP_RESTORE_YES: ${GITHUB_BACKUP_RESTORE_YES-}

services:
  # ── Local filesystem backup (default profile) ──────────────────────────────
  # No config.toml is mounted by default so a fresh checkout works
  # immediately.  Mount one explicitly with:
  #   docker compose run --rm \
  #     -v $(pwd)/config.toml:/etc/github-backup/config.toml:ro \
  #     backup --config /etc/github-backup/config.toml
  backup:
    <<: *common
    command:
      - "--output"
      - "/backup"

  # ── --doctor pre-flight check ──────────────────────────────────────────────
  # Confirms git, network, token, and TLS before scheduling a real run.
  doctor:
    <<: *common
    profiles: [doctor]
    command:
      - "--output"
      - "/backup"
      - "--doctor"

  # ── Interactive TUI ────────────────────────────────────────────────────────
  # Allocates a TTY so ratatui can render.  Use `docker compose run --rm tui`,
  # not `up`, so the foreground TTY attaches correctly.
  tui:
    <<: *common
    profiles: [tui]
    tty: true
    stdin_open: true
    command:
      - "--output"
      - "/backup"
      - "--tui"

  # ── Verify an existing backup ──────────────────────────────────────────────
  verify:
    <<: *common
    profiles: [verify]
    command:
      - "--output"
      - "/backup"
      - "--verify"

  # ── AWS S3 metadata sync ───────────────────────────────────────────────────
  backup-s3:
    <<: *common
    profiles: [s3]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      BACKUP_ENCRYPT_KEY: ${BACKUP_ENCRYPT_KEY-}
    command:
      - "--output"
      - "/backup"
      - "--s3-bucket"
      - "${S3_BUCKET:-my-github-backup-bucket}"
      - "--s3-region"
      - "${S3_REGION:-us-east-1}"

  # ── Backblaze B2 (S3-compatible) ───────────────────────────────────────────
  backup-b2:
    <<: *common
    profiles: [b2]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      AWS_ACCESS_KEY_ID: ${B2_KEY_ID:?B2_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${B2_APP_KEY:?B2_APP_KEY is required}
    command:
      - "--output"
      - "/backup"
      - "--s3-bucket"
      - "${B2_BUCKET:-my-b2-bucket}"
      - "--s3-region"
      - "${B2_REGION:-us-west-004}"
      - "--s3-endpoint"
      - "https://s3.${B2_REGION:-us-west-004}.backblazeb2.com"

  # ── MinIO (self-hosted S3-compatible) ──────────────────────────────────────
  minio:
    profiles: [minio]
    image: minio/minio:latest
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup-minio:
    <<: *common
    profiles: [minio]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - "--output"
      - "/backup"
      - "--s3-bucket"
      - "${MINIO_BUCKET:-github-backup}"
      - "--s3-region"
      - "us-east-1"
      - "--s3-endpoint"
      - "http://minio:9000"

  # ── Codeberg / Forgejo / Gitea mirror ──────────────────────────────────────
  backup-codeberg:
    <<: *common
    profiles: [codeberg]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      MIRROR_TOKEN: ${MIRROR_TOKEN:?MIRROR_TOKEN is required}
    command:
      - "--output"
      - "/backup"
      - "--mirror-to"
      - "${MIRROR_URL:-https://codeberg.org}"
      - "--mirror-owner"
      - "${MIRROR_OWNER:?MIRROR_OWNER is required}"

  # ── GitLab mirror ──────────────────────────────────────────────────────────
  backup-gitlab:
    <<: *common
    profiles: [gitlab]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      MIRROR_TOKEN: ${GITLAB_TOKEN:?GITLAB_TOKEN is required}
    command:
      - "--output"
      - "/backup"
      - "--mirror-to"
      - "${GITLAB_URL:-https://gitlab.com}"
      - "--mirror-type"
      - "gitlab"
      - "--mirror-owner"
      - "${GITLAB_NAMESPACE:?GITLAB_NAMESPACE is required}"

volumes:
  minio-data:
